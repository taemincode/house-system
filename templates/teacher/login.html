{% extends 'base.html' %}
{% block content %}
<div class="teacher-card login-card"><p class="coin-eyebrow">For teachers</p><h1>Welcome back.</h1><p>Sign in to give digital house coins.</p>
{% if error %}<p class="coin-notice error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="coin-form"><input type="hidden" name="_csrf" value="{{ teacher_csrf() }}">
<label>Username<input name="username" required maxlength="50" autocomplete="username" autocapitalize="none" value="{{ request.form.get('username','') }}"></label>
<label>Password<input type="password" name="password" required maxlength="128" autocomplete="current-password"></label>
<button class="coin-button primary">Log in →</button></form></div>
{% endblock %}
