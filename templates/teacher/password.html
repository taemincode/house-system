{% extends 'base.html' %}
{% block content %}<div class="teacher-card login-card"><h1>Change password</h1><p>{% if teacher_account.must_change %}Choose your own password before giving coins.{% else %}Use at least 8 characters.{% endif %}</p>
{% if error %}<p class="coin-notice error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="coin-form"><input type="hidden" name="_csrf" value="{{ teacher_csrf() }}">
<label>Current password<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label>
<label>New password<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
<label>Repeat new password<input type="password" name="confirm_password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
<button class="coin-button primary">Save password</button></form></div>{% endblock %}
