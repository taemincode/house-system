<header class="site-header">
  <a class="brand" href="{{ url_for('standings') }}">WIS HOUSES</a>
  <nav aria-label="Main navigation">
    <a href="{{ url_for('standings') }}" {% if active == 'standings' %}aria-current="page"{% endif %}>Standings</a>
    <details class="house-nav">
      <summary class="{% if active == 'houses' %}active{% endif %}"><span>Houses</span><svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="house-menu">
        {% for item in houses %}
        <a class="{{ item.id }}" href="{{ url_for('house', slug=item.id) }}" {% if house is defined and house.id == item.id %}aria-current="page"{% endif %}>
          <img class="house-menu-logo" src="{{ url_for('static', filename=item.logo) }}" width="44" height="44" alt="">
          <span>{{ item.name }}</span>
          <svg class="house-menu-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        {% endfor %}
      </div>
    </details>
    <a href="{{ url_for('events') }}" {% if active == 'events' %}aria-current="page"{% endif %}>Events</a>
    <a href="{{ url_for('about') }}" {% if active == 'about' %}aria-current="page"{% endif %}>About</a>
    {% if teacher_account %}
    <a class="teacher-nav-link" href="{{ url_for('teachers.give') }}">Give coins</a>
    <a class="teacher-nav-link" href="{{ url_for('teachers.awards') }}">My awards</a>
    <form method="post" action="{{ url_for('teachers.logout') }}"><input type="hidden" name="_csrf" value="{{ teacher_csrf() }}"><button class="nav-logout">Log out</button></form>
    {% endif %}
  </nav>
</header>
